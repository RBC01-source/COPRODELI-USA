document.getElementById("viewer").addEventListener("click",e=>{

async function uploadDocs(id,k,files){
  if(!assets)return;const entries=[],bad=[];
  for(const f of files){
    if(!okExt.test(f.name||"")){bad.push(tx("badFmt",f.name));continue}
    if(f.size>MAXB){bad.push(tx("tooBig",f.name));continue}
    flash(tx("uploading",f.name),true);
    try{const r=await assets.upload(f);entries.push({id:r.id,name:f.name,type:f.type||r.contentType||"",size:f.size,fecha:today()})}
    catch(e){bad.push(tx("failUp",f.name)+(e&&e.code==="not_granted"?tx("needEdit"):""))}
  }
  const badTxt=bad.length?" · "+bad.join("; "):"";
  if(!entries.length){flash(bad.join("; ")||tx("noneLoaded"));return}
  const p=byProject(id);if(!p)return;
  const docs=JSON.parse(JSON.stringify(p.docs||{}));docs[k]=(docs[k]||[]).concat(entries);
  if(await write(id,{docs}))flash((entries.length>1?tx("loadedN",entries.length):tx("loaded1"))+badTxt,!bad.length);
}
async function delDoc(id,k,i){
  const p=byProject(id);if(!p)return;const docs=JSON.parse(JSON.stringify(p.docs||{}));const f=(docs[k]||[])[i];if(!f)return;
  docs[k].splice(i,1);
  if(await write(id,{docs})){flash(tx("removed"),true);try{await assets.delete(f.id)}catch(e){}}
}

  try{const r=await fetch(p.ficha);if(!r.ok)throw new Error("http "+r.status);const b=await r.blob();pdfUrls[p.id]=URL.createObjectURL(new Blob([b],{type:"application/pdf"}))}

async function setStage(id,ns){
  const p=byProject(id);if(!p||ns<0||ns>2||ns===(p.stage|0))return;
  const fechas=Object.assign({},p.fechas||{});
  if(ns<(p.stage|0)){for(let i=ns+1;i<3;i++)delete fechas[i]}else if(!fechas[ns])fechas[ns]=today();
  const hist=(p.historial||[]).concat([{stage:ns,fecha:today(),by:meId||"",nota:""}]);
  const ok=await write(id,{stage:ns,fechas,historial:hist});
  if(ok)flash(tx("movedTo",pTitle(p),STAGES[ns].k),true);
}

  else if(a==="vdoc"){openDoc(b.dataset.id,b.dataset.k,+b.dataset.i)}
  else if(a==="ppdf"){ui.pdf=!ui.pdf;renderPres()}
  else if(a==="pdown"){const p=list.find(x=>x.id===ui.pres);if(p)window.open(p.ficha,"_blank")}
});
function kpi(b,s){return'<div class="kpi"><b>'+esc(b)+'</b><span>'+esc(s)+'</span></div>'}

function card(p){
  const s=p.stage|0,st=STAGES[s],open=ui.open.has(p.id);
  const dias=daysSince((p.fechas||{})[s]);
  let chips='<span class="chip" style="--c:'+st.c+'">'+esc(st.k)+'</span>';
  if(p.estado&&p.estado!=="Al día")chips+=' <span class="chip '+(p.estado==="Detenido"?"bad":"warn")+'">'+esc(estLbl(p.estado))+'</span>';
  if(s===1&&dias!==null&&dias>=45)chips+=' <span class="chip warn">'+esc(tx("daysNoReply",dias))+'</span>';
  const mini='<div class="mini" style="--c:'+st.c+'">'+STAGES.map((_,i)=>'<i class="'+(i<=s?"on":"")+'"></i>').join("")+'</div>';
  let h='<div class="card" id="c-'+esc(p.id)+'"><button class="head" data-act="toggle" data-id="'+esc(p.id)+'" aria-expanded="'+open+'"><span class="num">'+((p.n||0)-(progOf(p)?progOf(p).off:0)||"")+'</span>'+(p.imagen&&/^assets\//.test(p.imagen)?'<span class="thumb"><img src="'+esc(p.imagen)+'" alt="" loading="lazy"></span>':'<span></span>')+'<span><div class="ttl">'+esc(pTitle(p))+'</div><div class="meta">'+esc(pPlace(p))+(p.financiador?" · "+esc(tx("funderLbl"))+": "+esc(p.financiador):"")+'</div>'+mini+'</span><span class="right"><div class="amt">'+usd(p.usd)+'</div><div>'+chips+'</div><div class="more">'+esc(open?tx("hide"):tx("seeDetail"))+'</div></span></button>';
  if(open)h+='<div class="body">'+(ui.edit===p.id?editForm(p):detail(p))+'</div>';
  return h+'</div>';
}

function detail(p){
  const s=p.stage|0,f=p.fechas||{};
  let h='<div class="grid2"><div><h3>'+esc(tx("description"))+'</h3><p>'+esc(pDesc(p))+'</p><h3>'+esc(tx("beneficiaries"))+'</h3><p>'+esc(pBen(p))+'</p>';
  if(pPend(p).length)h+='<h3>'+esc(tx("pendingHdr"))+'</h3><ul class="pend">'+pPend(p).map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
  h+='</div><div><h3>'+esc(tx("cycle"))+'</h3><ol class="steps" style="--c:'+STAGES[s].c+'">'+STAGES.map((x,i)=>'<li class="'+(i<s?"done":i===s?"cur done":"")+(i!==s?" clk":"")+'" style="--c:'+x.c+'"'+(i!==s?' data-act="setstage" data-id="'+esc(p.id)+'" data-i="'+i+'" title="'+esc(tx("goTo",x.k))+'"':"")+'><span class="d"></span><span>'+(i+1)+'. '+esc(x.k)+'<br><small>'+esc(x.d)+'</small></span><small>'+(f[i]?fmtD(f[i]):"")+'</small></li>').join("")+'</ol>';
  if(s>=3){h+='<h3>Avance de ejecución · '+(p.avance|0)+'%</h3><div class="prog"><i style="width:'+(p.avance|0)+'%"></i></div>'}
  h+='<div class="meta"><b>'+esc(tx("investment"))+':</b> '+usd(p.usd)+'<br>'+esc(tx("requested"))+': <b>'+(p.solicitado?usd(p.solicitado):"—")+'</b> · '+esc(tx("approvedLbl"))+': <b>'+(p.aprobado?usd(p.aprobado):"—")+'</b></div>';
  if(p.proxima)h+='<p style="margin-top:8px"><b>'+esc(tx("nextAction"))+':</b> '+esc(dat(p.proxima))+'</p>';
  if(p.notas)h+='<p><b>'+esc(tx("notes"))+':</b> '+esc(p.notas)+'</p>';
  h+='</div></div>';
  if(DOCS.some(d=>dfiles(p,d.k).length))h+='<h3 style="margin-top:14px">'+esc(tx("projDocs"))+'</h3>'+docsHtml(p,true);
  const next=STAGES[s+1];
  h+='<div class="row">'+(p.ficha&&/^(\/|https:|assets\/)/.test(p.ficha)?'<button class="btn" data-act="pdfopen" data-id="'+esc(p.id)+'">'+esc(tx("viewPdf"))+'</button>':"")+'<button class="btn p" data-act="pres" data-id="'+esc(p.id)+'">'+esc(tx("present"))+'</button>'+(p.diapositivas&&p.diapositivas.length?'<button class="btn" data-act="deck" data-id="'+esc(p.id)+'">'+esc(dk("deck"))+'</button>':"")+(next?'<button class="btn" data-act="advance" data-id="'+esc(p.id)+'">'+esc(tx("advanceTo",next.k))+'</button>':"")+'<button class="btn" data-act="edit" data-id="'+esc(p.id)+'">'+esc(tx("editTrack"))+'</button></div>';
  const hist=(p.historial||[]).slice().reverse();
  if(hist.length)h+='<h3 style="margin-top:14px">'+esc(tx("history"))+'</h3><ul class="hist">'+hist.map(x=>'<li>'+fmtD(x.fecha)+' · <b>'+esc((STAGES[x.stage]||{}).k||"")+'</b>'+(x.nota?' — '+esc(dat(x.nota)):"")+'</li>').join("")+'</ul>';
  return h;
}

function dv(p,f,def){const d=ui.draft[p.id];return d&&f in d?d[f]:def}
function editForm(p){
  const f=p.fechas||{};
  const stage=dv(p,"stage",p.stage|0);
  let h='<div class="f">'+
   fld(p,"financiador",tx("funderLbl"),p.financiador||"","text")+
   fld(p,"estado",tx("stateMgmt"),p.estado||"Al día","sel",ESTADOS,false,false,ESTADOS.map(estLbl))+
   fld(p,"stage",tx("currentStage"),stage,"sel",STAGES.map(s=>s.k),true)+
   fld(p,"solicitado","Monto solicitado (US$)",p.solicitado||"","number")+
   fld(p,"aprobado","Monto aprobado (US$)",p.aprobado||"","number");
  STAGES.forEach((s,i)=>{if(i>0)h+=fld(p,"f"+i,tx("dateOf",s.k),f[i]||"","date")});
  h+=fld(p,"proxima",tx("nextAction"),p.proxima||"","text",null,false,true)+
     fld(p,"notas",tx("notes"),p.notas||"","area",null,false,true)+
     fld(p,"nota","Nota del cambio (se guarda en el historial)","","text",null,false,true)+'</div>';
  h+='<div class="row"><button class="btn p" data-act="save" data-id="'+esc(p.id)+'">'+esc(tx("save"))+'</button><button class="btn" data-act="cancel">'+esc(tx("cancel"))+'</button></div>';
  return h;
}
function fld(p,key,label,val,type,opts,num,full,lbls){
  val=dv(p,key,val);const cls=full?' class="full"':"";
  let inp;
  if(type==="sel")inp='<select data-f="'+key+'">'+opts.map((o,i)=>{const v=num?i:o;return'<option value="'+esc(v)+'"'+(String(v)===String(val)?" selected":"")+'>'+esc(lbls?lbls[i]:o)+'</option>'}).join("")+'</select>';
  else if(type==="area")inp='<textarea rows="2" data-f="'+key+'">'+esc(val)+'</textarea>';
  else inp='<input data-f="'+key+'" type="'+type+'" value="'+esc(val)+'"'+(type==="number"?' min="0"':"")+'>';
  return'<label'+cls+'>'+esc(label)+inp+'</label>';
}

async function write(id,patch){
  try{await db.doc("projects/"+id).update(patch);return true}
  catch(e){flash(tx("saveFail")+(e&&e.message?e.message:tx("noPerm"))); return false}
}
function byProject(id){return list.find(p=>p.id===id)}

app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==="mode"){ui.mode=!ui.mode;render()}
  else if(act==="pres"){openPres(id)}
  else if(act==="deck"){openDeck(id)}
  else if(act==="pdfopen"){openPres(id);ui.pdf=true;renderPres()}
  else if(act==="prog"){ui.prog=b.dataset.k||"";ui.stage=null;ui.q="";ui.edit=null;render();window.scrollTo({top:0})}
  else if(act==="goto"){ui.prog=b.dataset.k;ui.stage=null;ui.q="";if(ui.mode){render();openPres(id);return}ui.open.add(id);render();const el=document.getElementById("c-"+id);if(el)el.scrollIntoView({block:"start"})}
  else if(act==="toggle"){if(ui.mode){openPres(id);return}ui.open.has(id)?ui.open.delete(id):ui.open.add(id);if(ui.edit===id&&!ui.open.has(id))ui.edit=null;render()}
  else if(act==="fstage"){const i=+b.dataset.i;ui.stage=ui.stage===i?null:i;render()}
  else if(act==="all"){if(ui.open.size)ui.open.clear();else list.forEach(p=>ui.open.add(p.id));ui.edit=null;render()}
  else if(act==="clear"){ui.stage=null;ui.q="";render()}
  else if(act==="setstage"){setStage(id,+b.dataset.i)}
  else if(act==="vdoc"){openDoc(id,b.dataset.k,+b.dataset.i)}
  else if(act==="ddel"){const key=id+b.dataset.k+b.dataset.i;if(ui.cdel===key){ui.cdel=null;delDoc(id,b.dataset.k,+b.dataset.i)}else{ui.cdel=key;render();setTimeout(()=>{if(ui.cdel===key){ui.cdel=null;render()}},4000)}}
  else if(act==="edit"){ui.edit=id;ui.draft[id]={};render()}
  else if(act==="cancel"){delete ui.draft[ui.edit];ui.edit=null;render()}
  else if(act==="advance"){
    const p=byProject(id);if(!p)return;const ns=(p.stage|0)+1;if(ns>2)return;
    b.disabled=true;
    const fechas=Object.assign({},p.fechas||{});fechas[ns]=today();
    const hist=(p.historial||[]).concat([{stage:ns,fecha:today(),by:meId||"",nota:""}]);
    const ok=await write(id,{stage:ns,fechas,historial:hist});
    if(ok)flash(tx("movedTo",pTitle(p),STAGES[ns].k),true);else b.disabled=false;
  }
  else if(act==="save"){
    const p=byProject(id),d=ui.draft[id]||{};if(!p)return;
    const patch={};
    ["financiador","estado","proxima","notas"].forEach(k=>{if(k in d)patch[k]=d[k]});
    ["avance","solicitado","aprobado"].forEach(k=>{if(k in d)patch[k]=Math.max(0,Number(d[k])||0)});
    if("avance" in patch)patch.avance=Math.min(100,patch.avance);
    const fechas=Object.assign({},p.fechas||{});let fch=false;
    for(let i=1;i<3;i++){if(("f"+i) in d){fch=true;if(d["f"+i])fechas[i]=d["f"+i];else delete fechas[i]}}
    const ns="stage" in d?Number(d.stage):(p.stage|0);
    if(ns!==(p.stage|0)){
      patch.stage=ns;if(ns<(p.stage|0)){for(let i=ns+1;i<3;i++)delete fechas[i];fch=true}else if(!fechas[ns]&&ns>0){fechas[ns]=today();fch=true}
      patch.historial=(p.historial||[]).concat([{stage:ns,fecha:today(),by:meId||"",nota:d.nota||""}]);
    }else if(d.nota){patch.historial=(p.historial||[]).concat([{stage:ns,fecha:today(),by:meId||"",nota:d.nota}])}
    if(fch)patch.fechas=fechas;
    if(!Object.keys(patch).length){ui.edit=null;render();return}
    b.disabled=true;
    const ok=await write(id,patch);
    if(ok){delete ui.draft[id];ui.edit=null;flash(tx("saved"),true);render()}else b.disabled=false;
  }
});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.q=t.value;renderKeepFocus("q");return}
  if(t.dataset&&t.dataset.f&&ui.edit){(ui.draft[ui.edit]=ui.draft[ui.edit]||{})[t.dataset.f]=t.value}
});
app.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.up){const fs=[...e.target.files];e.target.value="";uploadDocs(e.target.dataset.id,e.target.dataset.up,fs);return}
  if(e.target.id==="area"){ui.area=e.target.value;render()}});
app.addEventListener("focusout",()=>{if(deferred){deferred=false;setTimeout(render,0)}});
function renderKeepFocus(id){render();const el=document.getElementById(id);if(el){el.focus();const v=el.value;el.value="";el.value=v}}

if(db){
  db.collection("projects").onSnapshot(snap=>{
    const arr=[];
    snap.docs.forEach(d=>{const o=d.exists?d.data():null;if(o)arr.push(Object.assign({id:d.id},o))});
    arr.sort((a,b)=>(a.n||0)-(b.n||0));
    list=arr;loaded=true;
    const a=document.activeElement;
    if(a&&a.closest&&a.closest("#app")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=="q"){deferred=true;return}
    render();
  },err=>{app.innerHTML='<div class="empty">'+esc(tx("readFail"))+'</div>'});
}
